                    Доступен во всех лабораториях сети «ЛукаЛаб». Сдайте готовый комплекс анализов и приходите ко мне на профессиональную расшифровку.
                  </p>
                </div>
                <div className="lg:col-span-4 text-center">
                  <span className="font-cormorant text-3xl font-bold text-burgundy block mb-2">LukaLab</span>
                  <a href="https://t.me/molozhenkohealthy" target="_blank" className="inline-block bg-gold text-white font-bold px-6 py-3 rounded-full text-sm">
                    Уточнить филиал
                  </a>
                </div>
              </div>
            </div>
          </section>

          {/* SYMPTOM QUIZ */}
          <section id="quiz" className="py-20 bg-cream-100">
            <div className="max-w-3xl mx-auto px-4 sm:px-6 lg:px-8">
              <div className="text-center mb-10">
                <span className="text-xs uppercase font-bold tracking-widest text-terracotta block mb-2">Интерактивный тест</span>
                <h2 className="text-3xl font-bold font-playfair text-charcoal">Проверьте вероятность дефицитов</h2>
              </div>

              <div className="bg-white p-6 sm:p-10 rounded-3xl border border-cream-300 shadow-md">
                {!quizCompleted ? (
                  <div>
                    {/* Progress Bar */}
                    <div className="mb-6">
                      <div className="flex justify-between text-xs font-bold text-charcoal/60 uppercase tracking-wider mb-2">
                        <span>Отмечено: {quizSelected.length} из 8</span>
                        <span>{Math.round((quizSelected.length / 8) * 100)}%</span>
                      </div>
                      <div className="w-full h-2.5 bg-cream-200 rounded-full overflow-hidden">
                        <div
                          className="h-full bg-terracotta transition-all duration-300 rounded-full"
                          style={{ width: `${Math.round((quizSelected.length / 8) * 100)}%` }}
                        />
                      </div>
                    </div>

                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-4 mb-8">
                      {quizQuestions.map(q => (
                        <div
                          key={q.id}
                          onClick={() => toggleQuizSymptom(q.id)}
                          className={`p-4 rounded-xl border-2 cursor-pointer transition-all ${quizSelected.includes(q.id) ? 'border-terracotta bg-terracotta/10 font-bold' : 'border-cream-300 bg-cream-50'}`}
                        >
                          <span className="text-xs uppercase text-gold font-bold block mb-1">{q.category}</span>
                          <span className="text-sm text-charcoal">{q.symptom}</span>
                        </div>
                      ))}
                    </div>
                    <button onClick={() => setQuizCompleted(true)} className="w-full bg-terracotta text-white py-4 rounded-full font-bold shadow-md hover:bg-terracotta-hover">
                      Узнать результаты и рекомендации
                    </button>
                  </div>
                ) : (
                  <div className="text-center">
                    <span className="text-xs uppercase tracking-widest text-charcoal/60 font-bold block mb-1">Ваш результат экспресс-теста</span>
                    <h3 className="text-2xl sm:text-3xl font-bold font-playfair mb-3">
                      Вероятность дефицитов: <span className={quizSelected.length === 0 ? 'text-green-600' : quizSelected.length <= 3 ? 'text-gold' : 'text-terracotta'}>
                        {quizSelected.length === 0 ? 'Низкая' : quizSelected.length <= 3 ? 'Умеренная' : 'Высокая'}
                      </span>
                    </h3>
                    <p className="text-sm text-charcoal/80 mb-6 max-w-xl mx-auto leading-relaxed">
                      {quizSelected.length === 0
                        ? 'У вас не выражены явные симптомы дефицитов, однако плановый чек-ап поможет сохранить здоровье.'
                        : quizSelected.length <= 3
                        ? `Отмечено ${quizSelected.length} признака дефицитов. Рекомендуется сдать точечный чек-ап для предотвращения усугубления.`
                        : `Отмечено ${quizSelected.length} признаков дефицита микроэлементов и ресурсов. Рекомендуется индивидуальный разбор анализов!`}
                    </p>
                    <a href="https://t.me/molozhenkohealthy" target="_blank" className="inline-block bg-terracotta text-white px-8 py-3.5 rounded-full font-bold text-sm shadow-md hover:bg-terracotta-hover transition-all">
                      Получить расшифровку в Telegram →
                    </a>
                  </div>
                )}
              </div>
            </div>
          </section>

          {/* DISCOUNT CTA */}
          <section className="py-16 bg-cream-100">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
              <div className="bg-burgundy text-white p-6 sm:p-10 md:p-12 rounded-3xl border-2 border-gold/40 shadow-2xl flex flex-col lg:flex-row items-start lg:items-center justify-between gap-6 lg:gap-8 max-w-full">
                <div className="max-w-full">
                  <span className="text-xs font-bold uppercase tracking-widest text-gold block mb-2">Акция с флаера</span>
                  <div className="flex flex-wrap items-baseline gap-2 mb-2 max-w-full">
                    <span className="text-4xl xs:text-5xl sm:text-6xl font-bold font-playfair text-gold shrink-0">-30%</span>
                    <span className="text-xl sm:text-2xl md:text-3xl font-bold font-playfair text-white uppercase tracking-wide leading-tight break-words max-w-full">НА КОНСУЛЬТАЦИЮ</span>
                  </div>
                  <p className="text-sm text-gold-light font-medium">Предъявите купон при записи на консультацию в Telegram или по телефону.</p>
                </div>
                <a href="https://t.me/molozhenkohealthy" target="_blank" className="w-full sm:w-auto bg-gold text-burgundy font-bold px-8 py-4 rounded-full text-base text-center hover:bg-gold-light transition-all shadow-lg shrink-0">
                  Записаться со скидкой 30%
                </a>
              </div>
            </div>
          </section>

          {/* CONTACTS */}
          <section id="contacts" className="py-20 bg-cream-200 border-t border-cream-300">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
              <div className="grid grid-cols-1 lg:grid-cols-12 gap-12">
                <div className="lg:col-span-5 bg-white p-8 rounded-3xl border border-cream-300 shadow-sm">
                  <h3 className="text-2xl font-bold font-playfair text-burgundy mb-6">Контакты</h3>
                  <p className="text-sm font-bold text-charcoal mb-4">Телефон: <a href="tel:89832499417" className="text-terracotta">8 983 249-94-17</a></p>
                  <p className="text-sm font-bold text-charcoal mb-6">Telegram: <a href="https://t.me/molozhenkohealthy" target="_blank" className="text-terracotta">@molozhenkohealthy</a></p>

                  <div className="p-4 bg-cream-100 rounded-2xl text-center border border-gold/30">
                    <img src="public/images/qr.png" alt="Telegram QR" className="w-32 h-32 object-contain mx-auto mb-2" />
                    <span className="font-cormorant text-lg font-bold text-burgundy block">сканируй и подписывайся!</span>
                  </div>
                </div>

                <div className="lg:col-span-7 bg-white p-8 rounded-3xl border border-cream-300 shadow-sm">
                  <h3 className="text-2xl font-bold font-playfair text-charcoal mb-4">Форма обратной связи</h3>
                  {!contactSubmitted ? (
                    <form onSubmit={(e) => { e.preventDefault(); setContactSubmitted(true); }} className="space-y-4">
                      <input type="text" required placeholder="Ваше имя" value={contactName} onChange={e => setContactName(e.target.value)} className="w-full p-3 rounded-xl border border-cream-300 text-sm" />
                      <input type="text" required placeholder="Телефон / Telegram" value={contactPhone} onChange={e => setContactPhone(e.target.value)} className="w-full p-3 rounded-xl border border-cream-300 text-sm" />
                      <button type="submit" className="w-full bg-terracotta text-white py-3 rounded-full font-bold text-sm">
                        Отправить заявку
                      </button>
                    </form>
                  ) : (
                    <div className="text-center py-8">
                      <h4 className="text-xl font-bold font-playfair text-burgundy mb-2">Заявка принята!</h4>
                      <p className="text-sm text-charcoal/70">Анна свяжется с вами в ближайшее время.</p>
                    </div>
                  )}
                </div>
              </div>
            </div>
          </section>

          {/* FOOTER */}
          <footer className="bg-charcoal text-white py-12 border-t-2 border-gold text-center text-xs">
            <p className="font-cormorant text-2xl font-bold text-gold mb-2">Анна Моложенко</p>
            <p className="text-white/60 mb-4">Фармацевт · Нутрициолог · Эксперт по анализам</p>
            <p className="text-white/40">© {new Date().getFullYear()} Все права защищены.</p>
          </footer>

          {/* FLOATING TELEGRAM BUTTON */}
          <a href="https://t.me/molozhenkohealthy" target="_blank" className="fixed bottom-6 right-6 w-14 h-14 bg-terracotta text-white rounded-full flex items-center justify-center shadow-2xl animate-pulse-subtle z-50">
            <svg className="w-6 h-6 fill-current" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm4.64 6.8c-.15 1.58-.8 5.42-1.13 7.19-.14.75-.42 1-.68 1.03-.58.05-1.02-.38-1.58-.75-.88-.58-1.38-.94-2.23-1.5-.99-.65-.35-1.01.22-1.59.15-.15 2.71-2.48 2.76-2.69.01-.03.01-.14-.07-.2-.08-.06-.19-.04-.27-.02-.12.02-[...]"/></svg>
          </a>

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
